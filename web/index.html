<!DOCTYPE html>
<html>
<head>
  <!--
    Caminho relativo, não o placeholder padrão ($FLUTTER_BASE_HREF, que vira
    "/" quando ninguém passa --base-href). O preview do FlutLab hospeda o app
    numa subpasta (https://preview.flutlab.io/<usuario>/aura/), e com "/" todo
    recurso era pedido na raiz do domínio — flutter_bootstrap.js, favicon.png
    e manifest.json voltavam 404, e o app nunca chegava a começar (tela preta
    sem erro nenhum de Flutter, porque o Flutter nunca chegou a rodar).

    "./" resolve a partir da própria URL, então funciona igual na raiz local
    (`flutter run -d chrome`) e em qualquer subpasta de hospedagem — desde que
    a URL termine com "/", que é como o Flutter sempre serve o `index.html`.
  -->
  <base href="./">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Um Pomodoro que aprende com você: cruza humor com desempenho de foco e devolve descobertas pessoais.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Aura">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Aura</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
