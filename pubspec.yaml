name: aura
description: "Aura - um Pomodoro que aprende com você. Cruza humor com desempenho de foco e devolve descobertas pessoais. Tudo local, sem login."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  percent_indicator: ^4.2.5
  fl_chart: ^1.2.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
